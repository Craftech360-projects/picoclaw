name: build

on:
  push:
    branches: [ "main" ]
    paths:
      - "cmd/picoclaw-livekit/**"
      - "pkg/livekit/**"
      - "pkg/voice/**"
      - "pkg/tools/**"
      - "pkg/providers/**"
      - "pkg/config/**"
      - "workspace-template/skills/**"
      - "scripts/stt_providers_postgres.sql"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # third_party/ten-vad's prebuilt libten_vad.so was compiled against libc++
    # (its undefined symbols are in the std::__1:: namespace), but cgo links
    # with gcc/libstdc++ by default, so linking fails with "undefined
    # reference to std::__1::__vector_base_common".
    env:
      CGO_LDFLAGS: "-lc++ -lc++abi"
      # go test runs the compiled binary out of /tmp, where the $ORIGIN-relative
      # rpath baked in by pkg/voice/vad/ten_vad.go cannot resolve.
      LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ten-vad/lib/Linux/x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pkg/livekit reaches libopus/libopusfile (gopkg.in/hraban/opus.v2) and
      # libsoxr (github.com/livekit/media-sdk) through cgo + pkg-config, and
      # ubuntu-latest ships none of them. Without this the package does not
      # compile and every downstream error ("undefined: media") is cascade.
      - name: Install audio codec dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopus-dev libopusfile-dev libsoxr-dev \
                                  libc++-dev libc++abi-dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run LiveKit worker gate
        run: go test ./pkg/livekit ./cmd/picoclaw-livekit

      - name: Build voice worker
        run: make build-livekit
