name: PR

on:
  pull_request:
    paths:
      - "cmd/picoclaw-livekit/**"
      - "pkg/livekit/**"
      - "pkg/voice/**"
      - "pkg/tools/**"
      - "pkg/providers/**"
      - "pkg/config/**"
      - "workspace-template/skills/**"
      - "scripts/stt_providers_postgres.sql"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/pr.yml"

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # libopus/libopusfile (gopkg.in/hraban/opus.v2) and libsoxr
      # (github.com/livekit/media-sdk) are cgo dependencies of pkg/livekit and
      # ubuntu-latest ships neither. Every job here compiles that package, so
      # each needs them: without them the lint and vuln jobs report cascading
      # "undefined: media" typecheck errors rather than real findings.
      - name: Install audio codec dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopus-dev libopusfile-dev libsoxr-dev \
                                  libc++-dev libc++abi-dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: |
          go generate ./cmd/picoclaw-livekit/...
          go generate ./pkg/livekit/...
          go generate ./pkg/voice/...

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --build-tags=goolm,stdjson ./cmd/picoclaw-livekit/... ./pkg/livekit/... ./pkg/voice/... ./pkg/tools/... ./pkg/providers/... ./pkg/config/...

  vuln_check:
    name: Security Check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # libopus/libopusfile (gopkg.in/hraban/opus.v2) and libsoxr
      # (github.com/livekit/media-sdk) are cgo dependencies of pkg/livekit and
      # ubuntu-latest ships neither. Every job here compiles that package, so
      # each needs them: without them the lint and vuln jobs report cascading
      # "undefined: media" typecheck errors rather than real findings.
      - name: Install audio codec dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopus-dev libopusfile-dev libsoxr-dev \
                                  libc++-dev libc++abi-dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # One pattern, not six: the action interpolates go-package as a single
      # quoted argument, so a space-separated list arrives as one literal and
      # govulncheck answers "no packages matched the provided patterns" (exit
      # 2). This scan has therefore never run. ./... covers the six former
      # patterns and the rest of the module.
      - name: Run Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    # third_party/ten-vad's prebuilt libten_vad.so was compiled against libc++
    # (its undefined symbols are in the std::__1:: namespace), but cgo links
    # with gcc/libstdc++ by default, so linking the test binary fails with
    # "undefined reference to std::__1::__vector_base_common".
    env:
      CGO_LDFLAGS: "-lc++ -lc++abi"
      # go test runs the compiled binary out of /tmp, where the $ORIGIN-relative
      # rpath baked in by pkg/voice/vad/ten_vad.go cannot resolve.
      LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ten-vad/lib/Linux/x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # libopus/libopusfile (gopkg.in/hraban/opus.v2) and libsoxr
      # (github.com/livekit/media-sdk) are cgo dependencies of pkg/livekit and
      # ubuntu-latest ships neither. Every job here compiles that package, so
      # each needs them: without them the lint and vuln jobs report cascading
      # "undefined: media" typecheck errors rather than real findings.
      - name: Install audio codec dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopus-dev libopusfile-dev libsoxr-dev \
                                  libc++-dev libc++abi-dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: |
          go generate ./cmd/picoclaw-livekit/...
          go generate ./pkg/livekit/...
          go generate ./pkg/voice/...

      - name: Run LiveKit worker gate
        run: go test ./pkg/livekit ./cmd/picoclaw-livekit

      - name: Run go test
        run: go test -tags goolm,stdjson ./cmd/picoclaw-livekit/... ./pkg/livekit/... ./pkg/voice/... ./pkg/tools/... ./pkg/providers/... ./pkg/config/...
